            enum: [ALL, EARNED, LOCKED]
            default: ALL
      responses:
        '200':
          description: Achievements retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AchievementsListData'
              examples:
                default:
                  value:
                    success: true
                    data:
                      earnedCount: 8
                      inProgressCount: 15
                      xpEarned: 240
                      achievements:
                        - id: 1
                          name: Wild Explorer
                          description: Complete 5 lessons in the Kitchen World
                          iconUrl: /media/achievements/wild-explorer.png
                          status: EARNED
                          progressPercent: 100
                        - id: 2
                          name: Hidden Oasis
