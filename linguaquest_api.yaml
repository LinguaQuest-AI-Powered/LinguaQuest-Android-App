openapi: 3.0.3
info:
  title: Language Learning App API
  description: >
    Public REST API for authentication, registration, account verification,
    password reset, and social login. This is the Authentication module of a
    larger API that will be extended with additional resources over time.


    ## Conventionss

    - All request/response bodies use **camelCase** field names.

    - Every **successful** response is wrapped in the `SuccessResponse` envelope.

    - Every **error** response is wrapped in the `ErrorResponse` envelope and includes
      a numeric `errorCode` (mirrors the HTTP status) plus a machine-readable
      `errorKey` that clients can safely branch on (the `errorMessage` is
      human-readable and may change wording without notice).

    - All endpoints can return `400 Bad Request` (validation) and
      `500 Internal Server Error` (unexpected failure) in addition to the
      endpoint-specific errors documented below.

    - Unless explicitly documented otherwise, all endpoints **outside** the
      `/api/v1/auth/**` path require authentication using a **Bearer JWT** supplied
      in the `Authorization` request header:

      ```
      Authorization: Bearer <access_token>
      ```

    - `/auth/otp/send` is shared by two flows (`purpose: SIGNUP` and
      `purpose: PASSWORD_RESET`); `/auth/otp/verify` (email verification) and
      `/auth/forget-password/otp/verify` (password reset) remain two separate
      endpoints, since they return different data.


  version: 1.1.0
  contact:
    name: API Support

servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: https://staging-api.example.com/api/v1
    description: Staging

tags:
  - name: Auth
    description: Login, registration, token refresh, and email verification.
  - name: Password Reset
    description: Forgot-password flow (OTP verification + setting a new password).
  - name: OAuth
    description: Social login via Firebase (Google and Apple sign-in handled by Firebase SDK on mobile).
  - name: Home
    description: Aggregated dashboard data for the Home screen.
  - name: Worlds
    description: Browsing Worlds and their level paths.
  - name: Daily Rewards
    description: Daily login reward status and claiming.
  - name: Languages
    description: Managing the user's target languages and switching the active one.
  - name: Profile
    description: Viewing and managing the user's profile, statistics, and account information.
  - name: Leaderboard
    description: Viewing player rankings and comparing progress with other users.
  - name: Achievements
    description: Tracking unlocked achievements, milestones, and rewards earned by the user.
  - name: Wallet
    description: Reading and adjusting the user's XP and coin balances.
  - name: Gallery
    description: Getting the words history of the user
  - name: Devices
    description: Register and remove FCM device tokens for push notifications.
  - name: Notifications
    description: In-app notification history, unread counts, and read status.
  - name: Daily Mission
    description: Getting the daily mission for the user and marking it as completed.

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: >
        Creates a new user account with `isVerified: false`, client needs to send an email-verification OTP (`purpose: SIGNUP`, see
        `/auth/otp/send` / `/auth/otp/verify`). Does **not** return an access
        or refresh token - the user must verify their email and then call
        `/auth/login`.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  email: a@b.com
                  username: adham_a
                  password: Str0ngPass!
                  nativeLanguage: Arabic
                  targetLanguage: Spanish
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterResponseData'
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 1234
                      email: a@b.com
                      username: adham_a
                      nativeLanguage: Arabic
                      targetLanguage: Spanish
                      isVerified: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email or username is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email:
                  summary: Email already registered
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/register
                      errorCode: 409
                      errorKey: EMAIL_ALREADY_EXISTS
                      errorMessage: An account with this email already exists
                      errorTime: '2026-07-14T10:15:00Z'
                username:
                  summary: Username already taken
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/register
                      errorCode: 409
                      errorKey: USERNAME_ALREADY_EXISTS
                      errorMessage: This username is already taken
                      errorTime: '2026-07-14T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: >
        Authenticates a user and returns an access token / refresh token pair
        along with the user's profile. Fails with `403` if the account's
        email has not yet been verified (see `/auth/otp/send` and
        `/auth/otp/verify`).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: a@b.com
                  password: schiurwhviurh
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponseData'
              examples:
                default:
                  value:
                    success: true
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken: dGhpc19pc19hX3JlZnJlc2hfdG9rZW4...
                      tokenType: Bearer
                      expiresIn: 3600
                      user:
                        id: 1234
                        username: adham_a
                        photo: /u1/ahaeaw.jpg
                        nativeLanguage:
                          id: 10
                          name: Arabic
                          code: ar
                          imageUrl: https://cdn.linguaquest.com/languages/arabic.png
                        isVerified: true
                        targetLanguages: [Spanish, English]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/login
                      errorCode: 401
                      errorKey: INVALID_CREDENTIALS
                      errorMessage: Invalid credentials
                      errorTime: '2026-07-13T10:15:00Z'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/login
                      errorCode: 403
                      errorKey: EMAIL_NOT_VERIFIED
                      errorMessage: Please verify your email before logging in
                      errorTime: '2026-07-13T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: >
        Revokes the given refresh token, ending that session. Pass
        `allDevices: true` to revoke every refresh token for the account
        (log out everywhere). This call is idempotent - logging out with an
        already-revoked or unknown refresh token still returns `200`.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              default:
                value:
                  refreshToken: dGhpc19pc19hX3JlZnJlc2hfdG9rZW4...
                  allDevices: false
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: success
              examples:
                default:
                  value:
                    success: true
                    data:
                      status: success
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: >
        Issues a new access token (and rotates the refresh token) when the
        current access token has expired. The old refresh token is invalidated
        once used (rotation).
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshTokenResponseData'
              examples:
                default:
                  value:
                    success: true
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken: bmV3X3JlZnJlc2hfdG9rZW4...
                      tokenType: Bearer
                      expiresIn: 3600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token is invalid, expired, or has already been used/revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid or revoked token
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/refresh-token
                      errorCode: 401
                      errorKey: INVALID_REFRESH_TOKEN
                      errorMessage: Refresh token is invalid or has been revoked
                      errorTime: '2026-07-13T10:15:00Z'
                expired:
                  summary: Expired token
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/refresh-token
                      errorCode: 401
                      errorKey: REFRESH_TOKEN_EXPIRED
                      errorMessage: Refresh token has expired, please log in again
                      errorTime: '2026-07-13T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/languages:
    get:
      tags: [Auth]
      summary: List languages available to add
      description: >
        Returns the full language catalog with an `isAdded` flag per entry,
        which will be set with false in all languages because the user is still registering.
      operationId: getAvailableLanguages
      security: []
      responses:
        '200':
          description: Available languages retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          languages:
                            type: array
                            items:
                              $ref: '#/components/schemas/LanguageOption'
              examples:
                default:
                  value:
                    success: true
                    data:
                      languages:
                        - id: 3
                          name: Japanese
                          code: ja
                          imageUrl: /media/languages/japanese.png
                          isAdded: false
                        - id: 4
                          name: German
                          code: de
                          imageUrl: /media/languages/german.png
                          isAdded: false
                        - id: 5
                          name: Korean
                          code: ko
                          imageUrl: /media/languages/korean.png
                          isAdded: false
        '500':
          $ref: '#/components/responses/InternalServerError'


  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Send an OTP (email verification or password reset)
      description: >
        Sends a one-time code to the given email address for one of two
        purposes, selected via the `purpose` field:

        - `SIGNUP` - to be confirmed via `/auth/otp/verify`.

        - `PASSWORD_RESET` - to be confirmed via `/auth/forget-password/otp/verify`,
          which returns a `resetToken` used to set a new password.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
            examples:
              emailVerification:
                summary: Email verification
                value:
                  email: john@example.com
                  purpose: SIGNUP
              passwordReset:
                summary: Password reset
                value:
                  email: john@example.com
                  purpose: PASSWORD_RESET
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: success
              examples:
                default:
                  value:
                    success: true
                    data:
                      status: success
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No account exists for the given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/send
                      errorCode: 404
                      errorKey: EMAIL_NOT_FOUND
                      errorMessage: Email not found
                      errorTime: '2026-07-13T10:15:00Z'
        '429':
          description: OTP request is on cooldown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/send
                      errorCode: 429
                      errorKey: OTP_COOLDOWN
                      errorMessage: Please wait before requesting another OTP
                      errorTime: "2026-07-16T10:15:45.610396900Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify an email-verification OTP
      description: >
        Confirms the OTP sent via `/auth/otp/send` with
        `purpose: SIGNUP`. On success the account's email is
        marked as verified (`isVerified: true`); this endpoint does **not**
        return an access/refresh token.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          isVerified:
                            type: boolean
                            example: true
              examples:
                default:
                  value:
                    success: true
                    data:
                      isVerified: true
        '400':
          description: Wrong or malformed OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongOtp:
                  summary: Wrong OTP
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/verify
                      errorCode: 400
                      errorKey: INVALID_OTP
                      errorMessage: Wrong OTP
                      errorTime: '2026-07-13T10:15:00Z'
                validation:
                  summary: Missing field
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/verify
                      errorCode: 400
                      errorKey: VALIDATION_ERROR
                      errorMessage: 'otp is required'
                      errorTime: '2026-07-13T10:15:00Z'
        '404':
          description: No account exists for the given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/verify
                      errorCode: 404
                      errorKey: EMAIL_NOT_FOUND
                      errorMessage: Email not found
                      errorTime: "2026-07-13T10:15:00Z"
        '410':
          description: OTP not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/verify
                      errorCode: 410
                      errorKey: OTP_NOT_FOUND
                      errorMessage: OTP expired or not found
                      errorTime: '2026-07-14T10:15:00Z'

        '429':
          description: Maximum OTP verification attempts exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/verify
                      errorCode: 429
                      errorKey: MAX_ATTEMPTS_EXCEEDED
                      errorMessage: Too many attempts, request a new OTP
                      errorTime: "2026-07-15T16:03:20.573737100Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/forget-password/otp/verify:
    post:
      tags: [Password Reset]
      summary: Verify a password-reset OTP
      description: >
        Confirms the OTP sent via `/auth/otp/send` with
        `purpose: PASSWORD_RESET`. On success, returns a short-lived, single-use
        `resetToken` that must be submitted to `PATCH /auth/forget-password`
        to actually set the new password.
      operationId: verifyPasswordResetOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified - reset token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resetToken:
                            type: string
                            description: Single-use token, submit to PATCH /auth/forget-password.
                            example: rst_9f8e7d6c5b4a...
                          expiresIn:
                            type: integer
                            description: Seconds until the reset token expires.
                            example: 900
              examples:
                default:
                  value:
                    success: true
                    data:
                      resetToken: rst_9f8e7d6c5b4a...
                      expiresIn: 900
        '400':
          description: Wrong or malformed OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongOtp:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password/otp/verify
                      errorCode: 400
                      errorKey: INVALID_OTP
                      errorMessage: Wrong OTP
                      errorTime: '2026-07-14T10:15:00Z'
        '404':
          description: No account exists for the given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password/otp/verify
                      errorCode: 404
                      errorKey: EMAIL_NOT_FOUND
                      errorMessage: Email not found
                      errorTime: "2026-07-13T10:15:00Z"
        '410':
          description: OTP not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password/otp/verify
                      errorCode: 410
                      errorKey: OTP_NOT_FOUND
                      errorMessage: OTP expired or not found
                      errorTime: '2026-07-14T10:15:00Z'

        '429':
          description: Maximum OTP verification attempts exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password/otp/verify
                      errorCode: 429
                      errorKey: MAX_ATTEMPTS_EXCEEDED
                      errorMessage: Too many attempts, request a new OTP
                      errorTime: "2026-07-15T16:03:20.573737100Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/forget-password:
    patch:
      tags: [Password Reset]
      summary: Set a new password
      description: >
        Sets a new password using the `resetToken` obtained from
        `POST /auth/forget-password/otp/verify`. The reset token is
        single-use and is invalidated after a successful call, as are all
        existing refresh tokens for the account (the user is signed out
        everywhere and must log in again with the new password).
      operationId: setNewPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
            examples:
              default:
                value:
                  resetToken: rst_9f8e7d6c5b4a...
                  newPassword: NewStr0ngPass!
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: success
              examples:
                default:
                  value:
                    success: true
                    data:
                      status: success
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Reset token is invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid or already-used token
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password
                      errorCode: 401
                      errorKey: INVALID_RESET_TOKEN
                      errorMessage: Reset token is invalid or has already been used
                      errorTime: '2026-07-14T10:15:00Z'
                expired:
                  summary: Expired token
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password
                      errorCode: 401
                      errorKey: RESET_TOKEN_EXPIRED
                      errorMessage: Reset token has expired, please request a new one
                      errorTime: '2026-07-14T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/oauth/firebase:
    post:
      tags: [OAuth]
      summary: Log in or register via Firebase (Google or Apple)
      description: >
        Client performs Google or Apple sign-in via the Firebase SDK and
        sends the resulting Firebase `idToken` here. The backend verifies
        the token with Firebase Admin SDK, then either logs in the matching
        existing account or creates a new one (email is considered
        pre-verified by the OAuth provider, so `isVerified` is `true`
        immediately). New accounts are created with a username derived from
        the email prefix; `profileComplete` is `false` until
        `nativeLanguage` and `targetLanguage` are provided through `POST /profile/complete-profile`. If the email already belongs to a local
        (email/password) account, a `409` error is returned.
      operationId: oauthFirebase
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseLoginRequest'
            examples:
              default:
                value:
                  idToken: eyJhbGciOiJSUzI1NiIsImtpZCI6...
      responses:
        '200':
          description: Authenticated successfully (existing or newly-created account)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OAuthResponseData'
              examples:
                existingUser:
                  summary: Existing user
                  value:
                    success: true
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken: dGhpc19pc19hX3JlZnJlc2hfdG9rZW4...
                      tokenType: Bearer
                      expiresIn: 86400000
                      profileComplete: true
                      user:
                        id: 1234
                        username: adham_a
                        photo: /u1/ahaeaw.jpg
                        nativeLanguage: Arabic
                        isVerified: true
                        targetLanguages:
                          - id: 1
                            name: Spanish
                            code: es
                          - id: 2
                            name: English
                            code: en
                newUser:
                  summary: Newly-created user
                  value:
                    success: true
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
