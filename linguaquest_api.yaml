  /worlds/{worldId}/levels:
    get:
      tags: [Worlds]
      summary: Get the sequential level path for a World
      description: >
        Returns the ordered list of levels for a World, for rendering the
        visual level path (roadmap) shown after selecting a World.

        Level Status Rules:
        - At any given time, a world path contains at most ONE playable level (either INPROGRESS or AVAILABLE).
        - AVAILABLE levels have word: null until the user calls /start, which assigns a word and transitions status to INPROGRESS.
        - LOCKED levels cannot be played until previous levels are COMPLETED.
      operationId: getWorldLevels
      security:
        - bearerAuth: []
      parameters:
        - name: worldId
          in: path
          required: true
          schema:
            type: integer
          example: 10
      responses:
        '200':
          description: Level path retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WorldDetail'
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 10
                      name: Kitchen World
                      difficulty: EASY
                      levels:
                        - id: 144
                          order: 1
                          status: COMPLETED
                          word: Spoon
                        - id: 145
                          order: 2
                          status: INPROGRESS
                          word: Apple
                        - id: 146
                          order: 3
                          status: LOCKED
                          word: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: World not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/worlds/999/levels
                      errorCode: 404
                      errorKey: WORLD_NOT_FOUND
                      errorMessage: World not found
                      errorTime: '2026-07-17T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

