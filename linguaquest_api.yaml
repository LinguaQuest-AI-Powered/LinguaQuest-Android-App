components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error - one or more fields are missing or malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                error:
                  apiPath: /api/v1/auth/login
                  errorCode: 400
                  errorKey: VALIDATION_ERROR
                  errorMessage: 'email is required'
                  errorTime: '2026-07-13T10:15:00Z'

    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                error:
                  apiPath: /api/v1/home
                  errorCode: 401
                  errorKey: UNAUTHENTICATED
                  errorMessage: Authentication is required to access this resource
                  errorTime: '2026-07-17T10:15:00Z'

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                error:
                  apiPath: /api/v1/auth/login
                  errorCode: 500
                  errorKey: INTERNAL_SERVER_ERROR
                  errorMessage: An unexpected error occurred, please try again later
                  errorTime: '2026-07-13T10:15:00Z'

  schemas:
    SuccessResponse:
      type: object
      description: Standard envelope wrapping every successful response.
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Endpoint-specific payload (see each operation's response schema).

    ErrorResponse:
      type: object
      description: Standard envelope wrapping every error response.
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [apiPath, errorCode, errorKey, errorMessage, errorTime]
          properties:
            apiPath:
              type: string
              description: The request path that produced the error.
              example: /api/v1/auth/login
            errorCode:
              type: integer
              description: Mirrors the HTTP status code.
              example: 401
            errorKey:
              type: string
              description: Stable, machine-readable error identifier for client-side branching.
              enum:
                - VALIDATION_ERROR
                - INVALID_CREDENTIALS
                - EMAIL_NOT_VERIFIED
                - EMAIL_NOT_FOUND
                - EMAIL_ALREADY_EXISTS
                - USERNAME_ALREADY_EXISTS
                - INVALID_OTP
                - OTP_EXPIRED
                - INVALID_REFRESH_TOKEN
                - REFRESH_TOKEN_EXPIRED
                - INVALID_RESET_TOKEN
                - RESET_TOKEN_EXPIRED
                - INVALID_FIREBASE_TOKEN
                - TOO_MANY_REQUESTS
                - INTERNAL_SERVER_ERROR
                - UNAUTHENTICATED
                - WORLD_NOT_FOUND
                - LANGUAGE_NOT_FOUND
                - LANGUAGE_ALREADY_ADDED
                - DAILY_REWARD_ALREADY_CLAIMED
                - INVALID_PASSWORD
                - ACHIEVEMENT_REWARD_ALREADY_CLAIMED
                - INVALID_TOKEN
                - PROFILE_ALREADY_COMPLETED
                - NOTIFICATION_NOT_FOUND
              example: INVALID_CREDENTIALS
            errorMessage:
              type: string
              description: Human-readable message, safe to display to the user.
              example: Invalid credentials
            errorTime:
              type: string
              format: date-time
              example: '2026-07-13T10:15:00Z'

    RegisterRequest:
      type: object
      required: [email, username, password, nativeLanguage, targetLanguage]
      properties:
        email:
          type: string
          format: email
          example: a@b.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
          example: adham_a
        password:
          type: string
          format: password
          minLength: 8
          description: Assumed policy - min 8 chars, at least one letter and one digit.
          example: Str0ngPass!
        nativeLanguage:
          type: string
          example: Arabic
        targetLanguage:
          type: string
          description: Single language for now; may become an array in a future version.
          example: Spanish

    RegisterResponseData:
      type: object
      properties:
        id:
          type: integer
          example: 1234
        email:
          type: string
          format: email
          example: a@b.com
        username:
          type: string
          example: adham_a
        nativeLanguage:
          type: string
          example: Arabic
        targetLanguage:
          type: string
          example: Spanish
        isVerified:
          type: boolean
          example: false

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: a@b.com
        password:
          type: string
          format: password
          minLength: 8
          example: schiurwhviurh

    LoginResponseData:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT used to authenticate subsequent requests.
        refreshToken:
          type: string
          description: Long-lived opaque token used to obtain a new access token via /auth/refresh-token.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: dGhpc19pc19hX3JlZnJlc2hfdG9rZW4...

    RefreshTokenResponseData:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Newly-issued refresh token (rotation) - replace the old one on the client.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600

    OtpSendRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        purpose:
          type: string
          enum: [SIGNUP, PASSWORD_RESET]
          example: SIGNUP

    OtpVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        otp:
          type: string
          description: 4-digit one-time password.
          example: "4823"
          minLength: 4
          maxLength: 4
          pattern: '^\d{4}$'

    ForgetPasswordRequest:
      type: object
      required: [resetToken, newPassword]
      properties:
        resetToken:
          type: string
          example: rst_9f8e7d6c5b4a...
        newPassword:
          type: string
          format: password
          minLength: 8
          example: NewStr0ngPass!

    FirebaseLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Firebase ID token obtained after Google or Apple sign-in via the Firebase SDK on the client.
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6...

    CompleteProfileRequest:
      type: object
      required: [nativeLanguageId, targetLanguageId]
      properties:
        nativeLanguageId:
          type: integer
          format: int64
          example: 1
        targetLanguageId:
          type: integer
          format: int64
          example: 2
        username:
          type: string
          nullable: true
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
          example: custom_user123

    OAuthResponseData:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        profileComplete:
          type: boolean
          description: False when nativeLanguage/targetLanguage/username still need to be collected.
          example: true
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1234
        username:
          type: string
          nullable: true
          example: adham_a
        photo:
          type: string
          nullable: true
          example: /u1/ahaeaw.jpg
        nativeLanguage:
          $ref: '#/components/schemas/TargetLanguage'
        isVerified:
          type: boolean
          example: true
        targetLanguages:
          type: array
          items:
            $ref: '#/components/schemas/TargetLanguage'

    TargetLanguage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Spanish
        code:
          type: string
          example: es
        imageUrl:
          type: string
          example: /media/languages/spanish.png

    HomeResponseData:
      type: object
      properties:
        xp:
          type: integer
          example: 1250
        coins:
          type: integer
          example: 46
        streakDays:
          type: integer
          example: 7
