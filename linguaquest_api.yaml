        journey progress, and small previews of Achievements and Leaderboard
        (for the "View All" rows). Use `GET /achievements` and
        `GET /leaderboard` for the full lists.
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProfileResponseData'
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 1234
                      email: adham_a@example.com
                      username: adham_a
                      nativeLanguage: Arabic
                      photoUrl: /media/avatars/alex.jpg
                      level: 12
                      stats:
                        coins: 1250
                        totalXp: 4500
                        streakDays: 7
                        worldsCount: 2
                      currentLanguageJourney:
                        languageId: 2
                        name: French
                        code: fr
                        level: 12
                        journeyLabel: Intermediate Journey
                        currentXp: 2460
                        nextMilestoneXp: 3000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Profile]
      summary: Edit profile details
      description: Updates the user's display name and/or username.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              default:
                value:
                  username: explorer_alex
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1234
                          username:
                            type: string
                            example: explorer_alex
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 1234
                      username: explorer_alex
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Username is already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/profile
                      errorCode: 409
                      errorKey: USERNAME_ALREADY_EXISTS
                      errorMessage: This username is already taken
                      errorTime: '2026-07-17T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Profile]
      summary: Delete account
      description: >
        Permanently deletes the user's account and all associated data.
        Requires the account password as confirmation for local
        (email/password) accounts; optional for OAuth-only accounts
        (confirmation method for those not yet finalized - flag if needed).
      operationId: deleteProfile
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProfileRequest'
            examples:
              default:
                value:
                  password: Str0ngPass!
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: success
              examples:
                default:
                  value:
                    success: true
                    data:
                      status: success
        '401':
          description: Missing/invalid access token, or incorrect password confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                badPassword:
                  summary: Incorrect password
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/profile
                      errorCode: 401
                      errorKey: INVALID_PASSWORD
                      errorMessage: Incorrect password
                      errorTime: '2026-07-17T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /profile/photo:
    post:
      tags: [Profile]
      summary: Upload or replace the profile photo
