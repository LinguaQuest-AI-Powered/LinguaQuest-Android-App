  # --- Leaderboard ---
  /leaderboard:
    get:
      tags: [Leaderboard]
      summary: Get the leaderboard
      description: >
        Returns the top 3 (podium) plus a ranked page of players. The
        current user's own entry is always included and flagged via
        `isCurrentUser`, even if it falls outside the requested page.
      operationId: getLeaderboard
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [GLOBAL, LANGUAGE]
            default: GLOBAL
        - name: languageId
          in: query
          required: false
          description: Required when scope=LANGUAGE.
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Leaderboard retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
