  /wallet/adjust:
    post:
      tags: [Wallet]
      summary: Add or subtract XP and/or coins
      description: >
        Applies a signed delta to the user's XP and/or coin balance in a
        single atomic operation. Use a positive value to add and a negative
        value to subtract; omit a field (or send `0`) to leave that balance
        unchanged. Intended for internal/admin or system-triggered
        adjustments (e.g. purchases, corrections) rather than the standard
        gameplay reward flows, which have their own dedicated endpoints
        (`/worlds/{worldId}/levels/{levelId}/verify`, `/daily-reward/claim`,
        `/achievements/weekly-reward/claim`).
        Fails with `409` if the adjustment would bring either balance below zero.
      operationId: adjustWallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustWalletRequest'
            examples:
              addBoth:
                summary: Add XP and coins
                value:
                  xpDelta: 50
                  coinsDelta: 10
              subtractCoins:
                summary: Spend coins only
                value:
                  xpDelta: 0
                  coinsDelta: -20
      responses:
        '200':
          description: Wallet adjusted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdjustWalletResponseData'
              examples:
                default:
                  value:
                    success: true
                    data:
                      xpDelta: 50
                      coinsDelta: 10
                      xp: 1300
                      coins: 56
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Adjustment would result in a negative XP or coin balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/wallet/adjust
                      errorCode: 409
                      errorKey: INSUFFICIENT_BALANCE
                      errorMessage: This adjustment would result in a negative balance
                      errorTime: '2026-07-24T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

