name: Build Debug APK

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "BASE_URL=$BASE_URL" >> local.properties
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Send notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord webhook secret is not set. Skipping notification."
            exit 0
          fi
          
          # Send the GitHub Actions run link to Discord where the artifact is hosted
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"New Debug APK built successfully! :rocket:\n**Download here (Under Artifacts):** $RUN_URL\"}" \
               $DISCORD_WEBHOOK
