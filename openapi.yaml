openapi: 3.0.3
info:
  title: Language Learning App API
  description: >
    Public REST API for authentication, registration, account verification,
    password reset, and social login. This is the Authentication module of a
    larger API that will be extended with additional resources over time.


    ## Conventions

    - All request/response bodies use **camelCase** field names.

    - Every **successful** response is wrapped in the `SuccessResponse` envelope.

    - Every **error** response is wrapped in the `ErrorResponse` envelope and includes
      a numeric `errorCode` (mirrors the HTTP status) plus a machine-readable
      `errorKey` that clients can safely branch on (the `errorMessage` is
      human-readable and may change wording without notice).

    - All endpoints can return `400 Bad Request` (validation) and
      `500 Internal Server Error` (unexpected failure) in addition to the
      endpoint-specific errors documented below.


    - `/auth/otp/send` is shared by two flows (`purpose: SIGNUP` and
      `purpose: PASSWORD_RESET`); `/auth/otp/verify` (email verification) and
      `/auth/forget-password/otp/verify` (password reset) remain two separate
      endpoints, since they return different data.


    ## Open items / assumptions (flagged for confirmation, not yet approved)

    - Registration does **not** auto-login: it creates the account
      (`isVerified: false`) and does not return tokens. The backend
      auto-triggers a `purpose: SIGNUP` OTP on successful
      registration; the client can also call `/auth/otp/send` again to resend.
    - Google/Apple OAuth login for a **brand-new** user returns
      `isNewUser: true` and `profileComplete: false`, since `nativeLanguage`
      and `targetLanguage` (required at normal registration) aren't available
      from the OAuth provider. A follow-up "complete profile" endpoint to
      collect those fields isn't built yet - flag if you want it in this
      batch.
    - Password reset invalidates all existing refresh tokens for the account
      as a security best practice (forces re-login on all other devices).
    - Password policy (assumed, adjust if you have different rules): minimum
      8 characters, at least one letter and one digit.
    - Username: 3-30 characters, letters/numbers/underscores only.
  version: 1.1.0
  contact:
    name: API Support

servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: https://staging-api.example.com/api/v1
    description: Staging

tags:
  - name: Auth
    description: Login, registration, token refresh, and email verification.
  - name: Password Reset
    description: Forgot-password flow (OTP verification + setting a new password).
  - name: OAuth
    description: Social login via Google and Apple (mobile SDK token exchange).

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: >
        Creates a new user account with `isVerified: false`, client needs to send an email-verification OTP (`purpose: SIGNUP`, see
        `/auth/otp/send` / `/auth/otp/verify`). Does **not** return an access
        or refresh token - the user must verify their email and then call
        `/auth/login`.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                value:
                  email: a@b.com
                  username: adham_a
                  password: Str0ngPass!
                  nativeLanguage: Arabic
                  targetLanguage: Spanish
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RegisterResponseData'
              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 1234
                      email: a@b.com
                      username: adham_a
                      nativeLanguage: Arabic
                      targetLanguage: Spanish
                      isVerified: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email or username is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email:
                  summary: Email already registered
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/register
                      errorCode: 409
                      errorKey: EMAIL_ALREADY_EXISTS
                      errorMessage: An account with this email already exists
                      errorTime: '2026-07-14T10:15:00Z'
                username:
                  summary: Username already taken
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/register
                      errorCode: 409
                      errorKey: USERNAME_ALREADY_EXISTS
                      errorMessage: This username is already taken
                      errorTime: '2026-07-14T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: >
        Authenticates a user and returns an access token / refresh token pair
        along with the user's profile. Fails with `403` if the account's
        email has not yet been verified (see `/auth/otp/send` and
        `/auth/otp/verify`).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: a@b.com
                  password: schiurwhviurh
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponseData'
              examples:
                default:
                  value:
                    success: true
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken: dGhpc19pc19hX3JlZnJlc2hfdG9rZW4...
                      tokenType: Bearer
                      expiresIn: 3600
                      user:
                        id: 1234
                        username: adham_a
                        name: Adham Abdelrahman
                        photo: /u1/ahaeaw.jpg
                        nativeLanguage: Arabic
                        isVerified: true
                        targetLanguages: [Spanish, English]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/login
                      errorCode: 401
                      errorKey: INVALID_CREDENTIALS
                      errorMessage: Invalid credentials
                      errorTime: '2026-07-13T10:15:00Z'
        '403':
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/login
                      errorCode: 403
                      errorKey: EMAIL_NOT_VERIFIED
                      errorMessage: Please verify your email before logging in
                      errorTime: '2026-07-13T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: >
        Issues a new access token (and rotates the refresh token) when the
        current access token has expired. The old refresh token is invalidated
        once used (rotation).
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshTokenResponseData'
              examples:
                default:
                  value:
                    success: true
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken: bmV3X3JlZnJlc2hfdG9rZW4...
                      tokenType: Bearer
                      expiresIn: 3600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token is invalid, expired, or has already been used/revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid or revoked token
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/refresh-token
                      errorCode: 401
                      errorKey: INVALID_REFRESH_TOKEN
                      errorMessage: Refresh token is invalid or has been revoked
                      errorTime: '2026-07-13T10:15:00Z'
                expired:
                  summary: Expired token
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/refresh-token
                      errorCode: 401
                      errorKey: REFRESH_TOKEN_EXPIRED
                      errorMessage: Refresh token has expired, please log in again
                      errorTime: '2026-07-13T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Send an OTP (email verification or password reset)
      description: >
        Sends a one-time code to the given email address for one of two
        purposes, selected via the `purpose` field:

        - `SIGNUP` - to be confirmed via `/auth/otp/verify`.

        - `PASSWORD_RESET` - to be confirmed via `/auth/forget-password/otp/verify`,
          which returns a `resetToken` used to set a new password.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
            examples:
              emailVerification:
                summary: Email verification
                value:
                  email: john@example.com
                  purpose: SIGNUP
              passwordReset:
                summary: Password reset
                value:
                  email: john@example.com
                  purpose: PASSWORD_RESET
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: success
              examples:
                default:
                  value:
                    success: true
                    data:
                      status: success
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No account exists for the given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/send
                      errorCode: 404
                      errorKey: EMAIL_NOT_FOUND
                      errorMessage: Email not found
                      errorTime: '2026-07-13T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify an email-verification OTP
      description: >
        Confirms the OTP sent via `/auth/otp/send` with
        `purpose: SIGNUP`. On success the account's email is
        marked as verified (`isVerified: true`); this endpoint does **not**
        return an access/refresh token.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          isVerified:
                            type: boolean
                            example: true
              examples:
                default:
                  value:
                    success: true
                    data:
                      isVerified: true
        '400':
          description: Wrong or malformed OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongOtp:
                  summary: Wrong OTP
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/verify
                      errorCode: 400
                      errorKey: INVALID_OTP
                      errorMessage: Wrong OTP
                      errorTime: '2026-07-13T10:15:00Z'
                validation:
                  summary: Missing field
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/verify
                      errorCode: 400
                      errorKey: VALIDATION_ERROR
                      errorMessage: 'otp is required'
                      errorTime: '2026-07-13T10:15:00Z'
        '404':
          description: No account exists for the given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/verify
                      errorCode: 404
                      errorKey: EMAIL_NOT_FOUND
                      errorMessage: Email not found
                      errorTime: "2026-07-13T10:15:00Z"
        '410':
          description: OTP not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/otp/verify
                      errorCode: 410
                      errorKey: OTP_NOT_FOUND
                      errorMessage: OTP expired or not found
                      errorTime: '2026-07-14T10:15:00Z'

        '429':
            description: Maximum OTP verification attempts exceeded
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                examples:
                  default:
                    value:
                      success: false
                      error:
                        apiPath: /api/v1/auth/otp/verify
                        errorCode: 429
                        errorKey: MAX_ATTEMPTS_EXCEEDED
                        errorMessage: Too many attempts, request a new OTP
                        errorTime: "2026-07-15T16:03:20.573737100Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/forget-password/otp/verify:
    post:
      tags: [Password Reset]
      summary: Verify a password-reset OTP
      description: >
        Confirms the OTP sent via `/auth/otp/send` with
        `purpose: PASSWORD_RESET`. On success, returns a short-lived, single-use
        `resetToken` that must be submitted to `PATCH /auth/forget-password`
        to actually set the new password.
      operationId: verifyPasswordResetOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified - reset token issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resetToken:
                            type: string
                            description: Single-use token, submit to PATCH /auth/forget-password.
                            example: rst_9f8e7d6c5b4a...
                          expiresIn:
                            type: integer
                            description: Seconds until the reset token expires.
                            example: 900
              examples:
                default:
                  value:
                    success: true
                    data:
                      resetToken: rst_9f8e7d6c5b4a...
                      expiresIn: 900
        '400':
          description: Wrong or malformed OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongOtp:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password/otp/verify
                      errorCode: 400
                      errorKey: INVALID_OTP
                      errorMessage: Wrong OTP
                      errorTime: '2026-07-14T10:15:00Z'
        '404':
          description: No account exists for the given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: OTP not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password/otp/verify
                      errorCode: 410
                      errorKey: OTP_NOT_FOUND
                      errorMessage: OTP expired or not found
                      errorTime: '2026-07-14T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/forget-password:
    patch:
      tags: [Password Reset]
      summary: Set a new password
      description: >
        Sets a new password using the `resetToken` obtained from
        `POST /auth/forget-password/otp/verify`. The reset token is
        single-use and is invalidated after a successful call, as are all
        existing refresh tokens for the account (the user is signed out
        everywhere and must log in again with the new password).
      operationId: setNewPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgetPasswordRequest'
            examples:
              default:
                value:
                  resetToken: rst_9f8e7d6c5b4a...
                  newPassword: NewStr0ngPass!
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: success
              examples:
                default:
                  value:
                    success: true
                    data:
                      status: success
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Reset token is invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  summary: Invalid or already-used token
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password
                      errorCode: 401
                      errorKey: INVALID_RESET_TOKEN
                      errorMessage: Reset token is invalid or has already been used
                      errorTime: '2026-07-14T10:15:00Z'
                expired:
                  summary: Expired token
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/forget-password
                      errorCode: 401
                      errorKey: RESET_TOKEN_EXPIRED
                      errorMessage: Reset token has expired, please request a new one
                      errorTime: '2026-07-14T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/oauth/google:
    post:
      tags: [OAuth]
      summary: Log in or register via Google Sign-In
      description: >
        Client performs the Google sign-in natively (via the Google
        Identity SDK) and sends the resulting `idToken` here. The backend
        verifies the token's signature/audience/issuer with Google, then
        either logs in the matching existing account or creates a new one
        (email is considered pre-verified by Google, so `isVerified` is
        `true` immediately). New accounts are created without
        `nativeLanguage`/`targetLanguage`/`username`; `profileComplete` is
        `false` until those are provided through a separate endpoint.
      operationId: oauthGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthGoogleRequest'
      responses:
        '200':
          description: Authenticated successfully (existing or newly-created account)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OAuthResponseData'
              examples:
                existingUser:
                  summary: Existing user
                  value:
                    success: true
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken: dGhpc19pc19hX3JlZnJlc2hfdG9rZW4...
                      tokenType: Bearer
                      expiresIn: 3600
                      isNewUser: false
                      profileComplete: true
                      user:
                        id: 1234
                        username: adham_a
                        name: Adham Abdelrahman
                        photo: /u1/ahaeaw.jpg
                        nativeLanguage: Arabic
                        isVerified: true
                        targetLanguages: [Spanish, English]
                newUser:
                  summary: Newly-created user
                  value:
                    success: true
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken: dGhpc19pc19hX3JlZnJlc2hfdG9rZW4...
                      tokenType: Bearer
                      expiresIn: 3600
                      isNewUser: true
                      profileComplete: false
                      user:
                        id: 5678
                        username: null
                        name: Jane Doe
                        photo: null
                        nativeLanguage: null
                        isVerified: true
                        targetLanguages: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Google idToken is invalid, expired, or failed verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/oauth/google
                      errorCode: 401
                      errorKey: INVALID_ID_TOKEN
                      errorMessage: Google token is invalid or could not be verified
                      errorTime: '2026-07-14T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/oauth/apple:
    post:
      tags: [OAuth]
      summary: Log in or register via Sign in with Apple
      description: >
        Client performs Sign in with Apple natively and sends the resulting
        `identityToken` here (plus `authorizationCode` for server-side
        validation/revocation, and `fullName` if this is the first
        authorization - Apple only returns the user's name once, so the
        client must capture and forward it on first sign-in). Behaves like
        `/auth/oauth/google` otherwise.
      operationId: oauthApple
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAppleRequest'
      responses:
        '200':
          description: Authenticated successfully (existing or newly-created account)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OAuthResponseData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Apple identityToken is invalid, expired, or failed verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    error:
                      apiPath: /api/v1/auth/oauth/apple
                      errorCode: 401
                      errorKey: INVALID_IDENTITY_TOKEN
                      errorMessage: Apple token is invalid or could not be verified
                      errorTime: '2026-07-14T10:15:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation error - one or more fields are missing or malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                error:
                  apiPath: /api/v1/auth/login
                  errorCode: 400
                  errorKey: VALIDATION_ERROR
                  errorMessage: 'email is required'
                  errorTime: '2026-07-13T10:15:00Z'

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                success: false
                error:
                  apiPath: /api/v1/auth/login
                  errorCode: 500
                  errorKey: INTERNAL_SERVER_ERROR
                  errorMessage: An unexpected error occurred, please try again later
                  errorTime: '2026-07-13T10:15:00Z'

  schemas:
    SuccessResponse:
      type: object
      description: Standard envelope wrapping every successful response.
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Endpoint-specific payload (see each operation's response schema).

    ErrorResponse:
      type: object
      description: Standard envelope wrapping every error response.
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [apiPath, errorCode, errorKey, errorMessage, errorTime]
          properties:
            apiPath:
              type: string
              description: The request path that produced the error.
              example: /api/v1/auth/login
            errorCode:
              type: integer
              description: Mirrors the HTTP status code.
              example: 401
            errorKey:
              type: string
              description: Stable, machine-readable error identifier for client-side branching.
              enum:
                - VALIDATION_ERROR
                - INVALID_CREDENTIALS
                - EMAIL_NOT_VERIFIED
                - EMAIL_NOT_FOUND
                - EMAIL_ALREADY_EXISTS
                - USERNAME_ALREADY_EXISTS
                - INVALID_OTP
                - OTP_EXPIRED
                - INVALID_REFRESH_TOKEN
                - REFRESH_TOKEN_EXPIRED
                - INVALID_RESET_TOKEN
                - RESET_TOKEN_EXPIRED
                - INVALID_ID_TOKEN
                - INVALID_IDENTITY_TOKEN
                - TOO_MANY_REQUESTS
                - INTERNAL_SERVER_ERROR
              example: INVALID_CREDENTIALS
            errorMessage:
              type: string
              description: Human-readable message, safe to display to the user.
              example: Invalid credentials
            errorTime:
              type: string
              format: date-time
              example: '2026-07-13T10:15:00Z'

    RegisterRequest:
      type: object
      required: [email, username, password, nativeLanguage, targetLanguage]
      properties:
        email:
          type: string
          format: email
          example: a@b.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[a-zA-Z0-9_]+$'
          example: adham_a
        password:
          type: string
          format: password
          minLength: 8
          description: Assumed policy - min 8 chars, at least one letter and one digit.
          example: Str0ngPass!
        nativeLanguage:
          type: string
          example: Arabic
        targetLanguage:
          type: string
          description: Single language for now; may become an array in a future version.
          example: Spanish

    RegisterResponseData:
      type: object
      properties:
        id:
          type: integer
          example: 1234
        email:
          type: string
          format: email
          example: a@b.com
        username:
          type: string
          example: adham_a
        nativeLanguage:
          type: string
          example: Arabic
        targetLanguage:
          type: string
          example: Spanish
        isVerified:
          type: boolean
          example: false

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: a@b.com
        password:
          type: string
          format: password
          minLength: 8
          example: schiurwhviurh

    LoginResponseData:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived JWT used to authenticate subsequent requests.
        refreshToken:
          type: string
          description: Long-lived opaque token used to obtain a new access token via /auth/refresh-token.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: dGhpc19pc19hX3JlZnJlc2hfdG9rZW4...

    RefreshTokenResponseData:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Newly-issued refresh token (rotation) - replace the old one on the client.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600

    OtpSendRequest:
      type: object
      required: [email, purpose]
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        purpose:
          type: string
          enum: [SIGNUP, PASSWORD_RESET]
          example: SIGNUP

    OtpVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        otp:
          type: string
          example: '482193'
          minLength: 6
          maxLength: 6

    ForgetPasswordRequest:
      type: object
      required: [resetToken, newPassword]
      properties:
        resetToken:
          type: string
          example: rst_9f8e7d6c5b4a...
        newPassword:
          type: string
          format: password
          minLength: 8
          example: NewStr0ngPass!

    OAuthGoogleRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: ID token returned by the Google Identity SDK on the client.
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6...

    OAuthAppleRequest:
      type: object
      required: [identityToken]
      properties:
        identityToken:
          type: string
          description: Identity token (JWT) returned by Sign in with Apple on the client.
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6...
        authorizationCode:
          type: string
          description: Authorization code from Sign in with Apple, for server-side validation/revocation.
          example: c9f8e7d6b5a4...
        fullName:
          type: object
          description: >
            Only present on the user's first authorization - Apple does not
            return this again on subsequent sign-ins, so the client must
            capture and forward it the first time.
          properties:
            firstName:
              type: string
              example: Jane
            lastName:
              type: string
              example: Doe

    OAuthResponseData:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        isNewUser:
          type: boolean
          description: True if this call created a brand-new account.
          example: false
        profileComplete:
          type: boolean
          description: False when nativeLanguage/targetLanguage/username still need to be collected.
          example: true
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1234
        username:
          type: string
          nullable: true
          example: adham_a
        name:
          type: string
          example: Adham Abdelrahman
        photo:
          type: string
          nullable: true
          example: /u1/ahaeaw.jpg
        nativeLanguage:
          type: string
          nullable: true
          example: Arabic
        isVerified:
          type: boolean
          example: true
        targetLanguages:
          type: array
          items:
            type: string
          example: [Spanish, English]